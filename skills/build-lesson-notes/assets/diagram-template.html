<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="lesson-diagram-template" content="study-sketch-v1">
    <title>{{TITLE}}</title>
    <link
      rel="stylesheet"
      data-lesson-diagram-style
      href="{{STYLE_HREF}}"
    >
  </head>
  <body>
    <main
      id="lesson-diagram"
      aria-labelledby="diagram-title"
      data-render-state="pending"
    >
      <h1 id="diagram-title" class="visually-hidden">{{TITLE}}</h1>
      <script id="diagram-data" type="application/json">
        {
          "title": {{TITLE_JSON}},
          "width": 960,
          "height": 700,
          "direction": "top-down",
          "nodes": [
            {
              "id": "user",
              "label": "User",
              "rank": 0,
              "order": 0,
              "kind": "actor"
            },
            {
              "id": "agent-loop",
              "label": "Agent Loop",
              "rank": 1,
              "order": 0,
              "kind": "accent"
            },
            {
              "id": "model-client",
              "label": "Model Client",
              "rank": 2,
              "order": 0,
              "kind": "info"
            },
            {
              "id": "tool-executor",
              "label": "Tool Executor",
              "rank": 2,
              "order": 1,
              "kind": "info"
            },
            {
              "id": "provider-api",
              "label": "Provider API",
              "rank": 3,
              "order": 0,
              "kind": "default"
            },
            {
              "id": "fake-model",
              "label": "Fake Model",
              "rank": 3,
              "order": 1,
              "kind": "success"
            },
            {
              "id": "search-tool",
              "label": "Search Tool",
              "rank": 3,
              "order": 2,
              "kind": "default"
            },
            {
              "id": "state-store",
              "label": "State Store",
              "rank": 3,
              "order": 3,
              "kind": "danger"
            }
          ],
          "edges": [
            {
              "from": "user",
              "to": "agent-loop",
              "label": "Prompt",
              "lane": -1
            },
            {
              "from": "agent-loop",
              "to": "user",
              "label": "Response",
              "lane": 1
            },
            {
              "from": "agent-loop",
              "to": "model-client",
              "label": "Model request",
              "lane": -1
            },
            {
              "from": "model-client",
              "to": "agent-loop",
              "label": "Model response",
              "lane": 1,
              "dashed": true
            },
            {
              "from": "agent-loop",
              "to": "tool-executor",
              "label": "Tool call",
              "lane": -1
            },
            {
              "from": "tool-executor",
              "to": "agent-loop",
              "label": "Tool result",
              "lane": 1,
              "dashed": true
            },
            {
              "from": "model-client",
              "to": "provider-api",
              "label": "Live"
            },
            {
              "from": "model-client",
              "to": "fake-model",
              "label": "Test",
              "dashed": true
            },
            {
              "from": "tool-executor",
              "to": "search-tool",
              "label": "Read"
            },
            {
              "from": "tool-executor",
              "to": "state-store",
              "label": "Side effect"
            }
          ]
        }
      </script>
    </main>
    <script
      data-lesson-diagram-runtime
      src="{{RUNTIME_HREF}}"
    ></script>
  </body>
</html>
