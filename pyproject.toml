[project]
name = "study-development-ai-agents"
version = "0.1.0"
description = "Mechanism-first AI agent engineering curriculum and implementation labs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.9",
    "markdown>=3.8,<4",
    "openai>=2.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["lessons", "skills"]
