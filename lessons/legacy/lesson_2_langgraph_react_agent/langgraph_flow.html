<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Архивная пошаговая иллюстрация ReAct-агента на LangGraph">
  <title>ReAct-агент на LangGraph — архивный урок</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f7f7f8;
      --surface: #ffffff;
      --surface-muted: #f4f5f7;
      --border: #e1e4e8;
      --border-dark: #c9ced6;
      --text: #1f2328;
      --muted: #656d76;
      --blue: #2563eb;
      --blue-light: #eff6ff;
      --green: #1f883d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
        sans-serif;
      background: var(--page);
    }

    button {
      font: inherit;
      color: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
    }

    .lesson {
      display: grid;
      grid-template-columns: 235px minmax(0, 1fr);
      overflow: hidden;
    }

    .steps {
      padding: 14px;
      border-right: 1px solid var(--border);
      background: var(--surface-muted);
    }

    .step-button {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      width: 100%;
      gap: 10px;
      align-items: center;
      padding: 9px;
      text-align: left;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .step-button + .step-button {
      margin-top: 3px;
    }

    .step-button:hover {
      background: #e9ebef;
    }

    .step-button.is-current {
      border-color: #bfdbfe;
      background: var(--blue-light);
    }

    .step-button-number {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border-dark);
      border-radius: 50%;
      background: var(--surface);
    }

    .step-button.is-complete .step-button-number {
      color: var(--green);
      border-color: #a6d5b1;
      background: #effaf2;
    }

    .step-button.is-current .step-button-number {
      color: white;
      border-color: var(--blue);
      background: var(--blue);
    }

    .step-button-title {
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .content {
      min-width: 0;
    }

    .progress {
      height: 3px;
      background: var(--surface-muted);
    }

    .progress-fill {
      width: 12.5%;
      height: 100%;
      background: var(--blue);
      transition: width 240ms ease;
    }

    .step-content {
      padding: 30px 32px 34px;
    }

    .step-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 11px;
      color: var(--muted);
      font-size: 12px;
    }

    .owner {
      padding: 3px 7px;
      color: var(--blue);
      font-weight: 600;
      border: 1px solid #bfdbfe;
      border-radius: 5px;
      background: var(--blue-light);
    }

    .step-content h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 32px);
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .step-content > p {
      max-width: 780px;
      margin: 12px 0 22px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .graph-viewport {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-muted);
      scrollbar-color: var(--border-dark) transparent;
    }

    .graph-board {
      position: relative;
      width: 780px;
      min-width: 780px;
      height: 414px;
      margin: 0 auto;
      transition: transform 220ms ease;
      background:
        linear-gradient(to right, transparent 19px, #eceef1 20px, transparent 21px),
        linear-gradient(to bottom, transparent 19px, #eceef1 20px, transparent 21px);
      background-size: 20px 20px;
    }

    .state-strip {
      position: absolute;
      top: 16px;
      right: 18px;
      left: 18px;
      z-index: 3;
      display: flex;
      min-height: 58px;
      gap: 12px;
      align-items: center;
      padding: 10px 13px;
      border: 1px solid var(--border-dark);
      border-radius: 7px;
      background: var(--surface);
      transition: border-color 180ms ease, background 180ms ease;
    }

    .state-strip.is-active {
      border-color: var(--blue);
      background: var(--blue-light);
    }

    .state-title {
      flex: 0 0 auto;
      padding-right: 12px;
      font-size: 12px;
      font-weight: 700;
      border-right: 1px solid var(--border);
    }

    .state-fields {
      display: flex;
      min-width: 0;
      gap: 8px;
      overflow-x: auto;
    }

    .state-field {
      flex: 0 0 auto;
      padding: 5px 7px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface-muted);
    }

    .state-field b {
      color: var(--text);
      font-weight: 600;
    }

    .state-value {
      color: var(--blue);
      font-style: normal;
    }

    .edges {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .graph-edge {
      fill: none;
      stroke: #aeb4bd;
      stroke-width: 1.5;
      marker-end: url("#arrow-gray");
      transition: stroke 180ms ease, stroke-width 180ms ease;
    }

    .graph-edge.is-active {
      stroke: var(--blue);
      stroke-width: 2.2;
      stroke-dasharray: 7 5;
      marker-end: url("#arrow-blue");
      animation: edge-flow 700ms linear infinite;
    }

    .graph-node {
      position: absolute;
      z-index: 2;
      display: grid;
      width: 116px;
      min-height: 58px;
      padding: 9px;
      place-content: center;
      text-align: center;
      border: 1px solid var(--border-dark);
      border-radius: 7px;
      background: var(--surface);
      transition:
        border-color 180ms ease,
        background 180ms ease,
        transform 180ms ease;
    }

    .graph-node strong {
      font-size: 12px;
    }

    .graph-node small {
      margin-top: 3px;
      color: var(--muted);
      font-size: 9px;
    }

    .graph-node.is-active {
      border-color: var(--blue);
      background: var(--blue-light);
      transform: translateY(-2px);
      animation: node-in 240ms ease-out;
    }

    .node-start,
    .node-end {
      width: 80px;
      min-height: 40px;
      padding: 7px;
      border-radius: 999px;
    }

    .node-start { top: 153px; left: 24px; }
    .node-llm { top: 139px; left: 204px; }
    .node-tool { top: 252px; left: 204px; }
    .node-final { top: 104px; left: 440px; }
    .node-limit { top: 226px; left: 440px; }
    .node-end { top: 159px; left: 662px; }

    .concept-bar {
      position: absolute;
      right: 18px;
      bottom: 15px;
      left: 18px;
      z-index: 3;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .concept {
      padding: 8px 10px;
      color: var(--muted);
      font-size: 10px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      transition: border-color 180ms ease, background 180ms ease;
    }

    .concept b {
      display: block;
      margin-bottom: 2px;
      color: var(--text);
      font-size: 11px;
    }

    .concept.is-active {
      color: #1e40af;
      border-color: #bfdbfe;
      background: var(--blue-light);
    }

    .step-content.is-changing {
      animation: content-in 220ms ease-out;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 32px;
      border-top: 1px solid var(--border);
    }

    .control-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .button {
      display: inline-flex;
      height: 36px;
      gap: 7px;
      align-items: center;
      justify-content: center;
      padding: 0 13px;
      cursor: pointer;
      border: 1px solid var(--border-dark);
      border-radius: 7px;
      background: var(--surface);
    }

    .button:hover {
      background: var(--surface-muted);
    }

    .presentation-button {
      min-width: 108px;
    }

    .button-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .exit-presentation-icon {
      display: none;
    }

    .presentation-button[aria-pressed="true"] .enter-presentation-icon {
      display: none;
    }

    .presentation-button[aria-pressed="true"] .exit-presentation-icon {
      display: block;
    }

    button:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    body.presentation-active {
      overflow: hidden;
    }

    .lesson:fullscreen,
    .lesson.is-presenting {
      width: 100vw;
      height: 100vh;
      grid-template-columns: minmax(0, 1fr);
      border: 0;
      border-radius: 0;
      background: var(--surface);
    }

    .lesson:fullscreen .steps,
    .lesson.is-presenting .steps {
      display: none;
    }

    .lesson.is-presenting:not(:fullscreen) {
      position: fixed;
      inset: 0;
      z-index: 1000;
    }

    .lesson:fullscreen .content,
    .lesson.is-presenting .content {
      display: flex;
      min-height: 0;
      flex-direction: column;
    }

    .lesson:fullscreen .step-content,
    .lesson.is-presenting .step-content {
      display: grid;
      min-height: 0;
      flex: 1;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      padding: clamp(22px, 3vh, 36px) clamp(24px, 4vw, 72px)
        clamp(16px, 2vh, 26px);
      overflow: hidden;
    }

    .lesson:fullscreen .step-content h1,
    .lesson.is-presenting .step-content h1 {
      font-size: clamp(28px, 3vw, 42px);
    }

    .lesson:fullscreen .step-content > p,
    .lesson.is-presenting .step-content > p {
      max-width: 1100px;
      margin: 10px 0 18px;
    }

    .lesson:fullscreen .graph-viewport,
    .lesson.is-presenting .graph-viewport {
      display: grid;
      width: 100%;
      min-height: 0;
      height: 100%;
      place-items: center;
      overflow: hidden;
    }

    .lesson:fullscreen .graph-board,
    .lesson.is-presenting .graph-board {
      transform: scale(var(--presentation-scale, 1));
    }

    .lesson:fullscreen .controls,
    .lesson.is-presenting .controls {
      display: none;
    }

    @keyframes edge-flow {
      to {
        stroke-dashoffset: -12;
      }
    }

    @keyframes node-in {
      from {
        opacity: 0.55;
        transform: translateY(2px);
      }
      to {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    @keyframes content-in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 780px) {
      .page {
        width: min(100% - 20px, 1180px);
        padding: 28px 0;
      }

      .lesson {
        grid-template-columns: 1fr;
      }

      .steps {
        display: flex;
        gap: 5px;
        overflow-x: auto;
        padding: 10px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .step-button {
        flex: 0 0 auto;
        width: auto;
        grid-template-columns: 28px;
        padding: 6px;
      }

      .step-button + .step-button {
        margin-top: 0;
      }

      .step-button-title {
        display: none;
      }

      .step-content {
        padding: 24px 18px;
      }

      .controls {
        padding: 13px 18px;
      }
    }

    @media (max-width: 450px) {
      .controls {
        align-items: stretch;
        flex-direction: column;
      }

      .control-group {
        justify-content: space-between;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card lesson" id="lesson" aria-label="LangGraph step-by-step visualization">
      <nav class="steps" id="stepNavigation" aria-label="Steps"></nav>

      <div class="content">
        <div class="progress" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <article class="step-content" id="stepContent" aria-live="polite">
          <div class="step-meta">
            <span id="stepNumber">Step 1 of 8</span>
            <span class="owner" id="stepOwner">TypedDict</span>
          </div>
          <h1 id="stepTitle"></h1>
          <p id="stepDescription"></p>

          <div class="graph-viewport" id="graphViewport">
            <div class="graph-board">
              <div class="state-strip" id="stateStrip">
                <span class="state-title">AgentState</span>
                <div class="state-fields">
                  <span class="state-field">
                    <b>messages</b> =
                    <i class="state-value" id="stateMessages">1 сообщение</i>
                  </span>
                  <span class="state-field">
                    <b>step_count</b> =
                    <i class="state-value" id="stateStep">0</i>
                  </span>
                  <span class="state-field">
                    <b>current_action</b> =
                    <i class="state-value" id="stateAction">None</i>
                  </span>
                </div>
              </div>

              <svg class="edges" viewBox="0 0 780 414" aria-hidden="true">
                <defs>
                  <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5"
                          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#aeb4bd"></path>
                  </marker>
                  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
                          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"></path>
                  </marker>
                </defs>

                <path class="graph-edge" data-edge="start-llm"
                      d="M 104 173 C 143 173, 166 166, 201 166"></path>
                <path class="graph-edge" data-edge="llm-tool"
                      d="M 262 197 L 262 249"></path>
                <path class="graph-edge" data-edge="tool-llm"
                      d="M 204 280 C 145 280, 145 166, 201 166"></path>
                <path class="graph-edge" data-edge="llm-retry"
                      d="M 226 139 C 194 94, 326 88, 297 138"></path>
                <path class="graph-edge" data-edge="llm-final"
                      d="M 320 154 C 360 140, 399 131, 437 131"></path>
                <path class="graph-edge" data-edge="llm-limit"
                      d="M 320 179 C 365 195, 395 247, 437 250"></path>
                <path class="graph-edge" data-edge="final-end"
                      d="M 556 131 C 600 134, 623 169, 659 175"></path>
                <path class="graph-edge" data-edge="limit-end"
                      d="M 556 252 C 603 238, 624 186, 659 179"></path>
              </svg>

              <div class="graph-node node-start" data-node="start">
                <strong>START</strong>
              </div>
              <div class="graph-node node-llm" data-node="llm">
                <strong>llm</strong>
                <small>Reasoning Node</small>
              </div>
              <div class="graph-node node-tool" data-node="tool">
                <strong>tool</strong>
                <small>Acting Node</small>
              </div>
              <div class="graph-node node-final" data-node="final">
                <strong>final</strong>
                <small>сохранить answer</small>
              </div>
              <div class="graph-node node-limit" data-node="limit">
                <strong>step_limit</strong>
                <small>защита цикла</small>
              </div>
              <div class="graph-node node-end" data-node="end">
                <strong>END</strong>
              </div>

              <div class="concept-bar">
                <div class="concept" data-concept="state">
                  <b>State</b>
                  общая память всех узлов
                </div>
                <div class="concept" data-concept="node">
                  <b>Node</b>
                  функция, изменяющая State
                </div>
                <div class="concept" data-concept="edge">
                  <b>Edge</b>
                  маршрут к следующему Node
                </div>
              </div>
            </div>
          </div>
        </article>

        <footer class="controls">
          <div class="control-group">
            <button
              class="button"
              id="previousButton"
              type="button"
              aria-label="Previous slide"
            >
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
              <span>Previous</span>
            </button>
            <button
              class="button"
              id="nextButton"
              type="button"
              aria-label="Next slide"
            >
              <span>Next</span>
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 18 6-6-6-6"></path>
              </svg>
            </button>
          </div>

          <div class="control-group">
            <button
              class="button presentation-button"
              id="presentationButton"
              type="button"
              aria-pressed="false"
              title="Enter presentation mode (F)"
            >
              <svg
                class="button-icon enter-presentation-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3"></path>
                <path d="M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"></path>
              </svg>
              <svg
                class="button-icon exit-presentation-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3"></path>
                <path d="M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"></path>
              </svg>
              <span id="presentationButtonLabel">Presentation</span>
            </button>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <script>
    const steps = [
      {
        tab: "State",
        owner: "TypedDict",
        title: "State хранит память всего графа",
        description:
          "Все узлы читают одно типизированное состояние. В нём хранится полная история сообщений, число вызовов модели, текущее действие и итоговый ответ.",
        nodes: [],
        edges: [],
        concept: "state",
        stateActive: true,
        state: ["1 сообщение", "0", "None"]
      },
      {
        tab: "StateGraph",
        owner: "LangGraph",
        title: "StateGraph превращает функции в workflow",
        description:
          "После регистрации узлов и рёбер builder знает возможные маршруты агента. compile() создаёт исполняемый граф, который сам переносит State между шагами.",
        nodes: ["llm", "tool", "final", "limit"],
        edges: [],
        concept: "node",
        stateActive: true,
        state: ["1 сообщение", "0", "None"]
      },
      {
        tab: "START → Node",
        owner: "Normal Edge",
        title: "START передаёт управление в llm Node",
        description:
          "Обычное ребро всегда ведёт по одному маршруту. llm Node читает messages, вызывает модель и возвращает только изменённые поля State.",
        nodes: ["start", "llm"],
        edges: ["start-llm"],
        concept: "node",
        stateActive: false,
        state: ["2 сообщения", "1", "ToolCall"]
      },
      {
        tab: "Conditional Edge",
        owner: "Маршрутизация",
        title: "Условное ребро выбирает ветку",
        description:
          "Маршрут зависит от current_action: ToolCall ведёт к инструменту, FinalAnswer — к завершению, ошибка JSON — на повторный вызов LLM, а лимит — к безопасной остановке.",
        nodes: ["llm", "tool", "final", "limit"],
        edges: ["llm-tool", "llm-final", "llm-retry", "llm-limit"],
        concept: "edge",
        stateActive: false,
        state: ["2 сообщения", "1", "ToolCall"]
      },
      {
        tab: "Tool Node",
        owner: "Acting",
        title: "tool Node вызывает Python-инструмент",
        description:
          "ToolCall уже находится в State. Узел tool вызывает калькулятор и создаёт Observation, которое станет новым сообщением для следующего шага.",
        nodes: ["tool"],
        edges: ["llm-tool"],
        concept: "node",
        stateActive: false,
        state: ["2 сообщения", "1", "ToolCall"]
      },
      {
        tab: "Reducer",
        owner: "operator.add",
        title: "Reducer сохраняет всю историю",
        description:
          "Узел возвращает только одно новое Observation. operator.add соединяет его со старым списком, поэтому messages растёт с двух до трёх сообщений, а не перезаписывается.",
        nodes: ["tool"],
        edges: [],
        concept: "state",
        stateActive: true,
        state: ["3 сообщения", "1", "None"]
      },
      {
        tab: "Loop",
        owner: "Normal Edge",
        title: "Ребро tool → llm создаёт ReAct-цикл",
        description:
          "После выполнения инструмента граф всегда возвращается к модели. LLM видит накопленную историю, анализирует Observation и выбирает новый маршрут.",
        nodes: ["tool", "llm"],
        edges: ["tool-llm"],
        concept: "edge",
        stateActive: true,
        state: ["3 сообщения", "1", "None"]
      },
      {
        tab: "END",
        owner: "Завершение",
        title: "FinalAnswer или лимит ведут к END",
        description:
          "Узел final сохраняет готовый ответ. Если модель не завершила работу вовремя, step_limit останавливает цикл; после обоих узлов выполнение заканчивается в END.",
        nodes: ["llm", "final", "limit", "end"],
        edges: ["llm-final", "final-end", "llm-limit", "limit-end"],
        concept: "edge",
        stateActive: true,
        state: ["4 сообщения", "2", "FinalAnswer"]
      }
    ];

    const navigation = document.getElementById("stepNavigation");
    const lesson = document.getElementById("lesson");
    const progressFill = document.getElementById("progressFill");
    const stepContent = document.getElementById("stepContent");
    const stepNumber = document.getElementById("stepNumber");
    const stepOwner = document.getElementById("stepOwner");
    const stepTitle = document.getElementById("stepTitle");
    const stepDescription = document.getElementById("stepDescription");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const presentationButton = document.getElementById("presentationButton");
    const presentationButtonLabel = document.getElementById(
      "presentationButtonLabel"
    );
    const graphViewport = document.getElementById("graphViewport");
    const stateStrip = document.getElementById("stateStrip");
    const stateMessages = document.getElementById("stateMessages");
    const stateStep = document.getElementById("stateStep");
    const stateAction = document.getElementById("stateAction");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let currentStep = 0;
    let isPresentationMode = false;

    const stepButtons = steps.map((step, index) => {
      const button = document.createElement("button");
      const number = document.createElement("span");
      const title = document.createElement("span");

      button.type = "button";
      button.className = "step-button";
      number.className = "step-button-number";
      number.textContent = String(index + 1);
      title.className = "step-button-title";
      title.textContent = step.tab;

      button.append(number, title);
      button.addEventListener("click", () => {
        currentStep = index;
        render();
      });

      navigation.append(button);
      return button;
    });

    function centerActiveNodes() {
      if (graphViewport.scrollWidth <= graphViewport.clientWidth) return;

      const activeNodes = [...document.querySelectorAll(".graph-node.is-active")];
      if (activeNodes.length === 0) {
        graphViewport.scrollTo({
          left: 0,
          behavior: reducedMotion ? "auto" : "smooth"
        });
        return;
      }

      const viewportRect = graphViewport.getBoundingClientRect();
      const centers = activeNodes.map((node) => {
        const rect = node.getBoundingClientRect();
        return rect.left - viewportRect.left +
          graphViewport.scrollLeft + rect.width / 2;
      });
      const center = centers.reduce((sum, value) => sum + value, 0) / centers.length;

      graphViewport.scrollTo({
        left: Math.max(0, center - graphViewport.clientWidth / 2),
        behavior: reducedMotion ? "auto" : "smooth"
      });
    }

    function render() {
      const step = steps[currentStep];

      stepButtons.forEach((button, index) => {
        const isCurrent = index === currentStep;
        button.classList.toggle("is-current", isCurrent);
        button.classList.toggle("is-complete", index < currentStep);
        button.setAttribute("aria-current", isCurrent ? "step" : "false");
      });

      document.querySelectorAll(".graph-node").forEach((node) => {
        node.classList.toggle("is-active", step.nodes.includes(node.dataset.node));
      });

      document.querySelectorAll(".graph-edge").forEach((edge) => {
        edge.classList.toggle("is-active", step.edges.includes(edge.dataset.edge));
      });

      document.querySelectorAll(".concept").forEach((concept) => {
        concept.classList.toggle(
          "is-active",
          concept.dataset.concept === step.concept
        );
      });

      stateStrip.classList.toggle("is-active", step.stateActive);
      [stateMessages.textContent, stateStep.textContent, stateAction.textContent] =
        step.state;

      progressFill.style.width = `${((currentStep + 1) / steps.length) * 100}%`;
      stepNumber.textContent = `Step ${currentStep + 1} of ${steps.length}`;
      stepOwner.textContent = step.owner;
      stepTitle.textContent = step.title;
      stepDescription.textContent = step.description;

      stepContent.classList.remove("is-changing");
      void stepContent.offsetWidth;
      stepContent.classList.add("is-changing");

      window.requestAnimationFrame(() => {
        fitGraphToPresentation();
        centerActiveNodes();
      });
    }

    function move(direction) {
      currentStep = (currentStep + direction + steps.length) % steps.length;
      render();
    }

    previousButton.addEventListener("click", () => move(-1));
    nextButton.addEventListener("click", () => move(1));

    function updatePresentationButton() {
      presentationButtonLabel.textContent = isPresentationMode
        ? "Exit"
        : "Presentation";
      presentationButton.setAttribute(
        "aria-pressed",
        String(isPresentationMode)
      );
      presentationButton.title = isPresentationMode
        ? "Exit presentation mode (Esc)"
        : "Enter presentation mode (F)";
      window.requestAnimationFrame(() => {
        fitGraphToPresentation();
        centerActiveNodes();
      });
    }

    function fitGraphToPresentation() {
      const board = graphViewport.querySelector(".graph-board");

      if (!isPresentationMode) {
        board.style.removeProperty("--presentation-scale");
        return;
      }

      const availableWidth = Math.max(1, graphViewport.clientWidth - 32);
      const availableHeight = Math.max(1, graphViewport.clientHeight - 32);
      const scale = Math.min(
        availableWidth / 780,
        availableHeight / 414,
        1.8
      );

      board.style.setProperty(
        "--presentation-scale",
        String(Math.max(0.55, scale))
      );
    }

    function setPresentationMode(active) {
      isPresentationMode = active;
      lesson.classList.toggle("is-presenting", active);
      document.body.classList.toggle("presentation-active", active);
      updatePresentationButton();
    }

    async function togglePresentation() {
      if (isPresentationMode) {
        setPresentationMode(false);
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        }
        return;
      }

      setPresentationMode(true);

      if (!document.fullscreenEnabled || !lesson.requestFullscreen) return;

      try {
        await lesson.requestFullscreen();
      } catch (error) {
        console.info("Using viewport presentation mode:", error);
      }
    }

    presentationButton.addEventListener("click", togglePresentation);
    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement === lesson) {
        setPresentationMode(true);
      } else {
        updatePresentationButton();
      }
    });

    window.addEventListener("resize", () => {
      window.requestAnimationFrame(() => {
        fitGraphToPresentation();
        centerActiveNodes();
      });
    });

    document.addEventListener("keydown", (event) => {
      if (event.target instanceof Element && event.target.matches("button")) {
        return;
      }

      if (event.key === "ArrowLeft") {
        move(-1);
      } else if (event.key === "ArrowRight") {
        move(1);
      } else if (event.key.toLowerCase() === "f") {
        event.preventDefault();
        togglePresentation();
      } else if (
        event.key === "Escape" &&
        isPresentationMode &&
        !document.fullscreenElement
      ) {
        setPresentationMode(false);
      }
    });

    document.addEventListener("keyup", (event) => {
      if (
        event.key === "Escape" &&
        isPresentationMode &&
        !document.fullscreenElement
      ) {
        setPresentationMode(false);
      }
    });

    render();
  </script>
</body>
</html>
