<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="lesson-diagram-template" content="study-sketch-v1">
    <title>Наблюдения поставщика превращаются в проверяемый расход и решение о следующем шаге</title>
    <link
      rel="stylesheet"
      data-lesson-diagram-style
      href="../../../skills/build-lesson-notes/assets/diagram.css"
    >
  </head>
  <body>
    <main
      id="lesson-diagram"
      aria-labelledby="diagram-title"
      data-render-state="pending"
    >
      <h1 id="diagram-title" class="visually-hidden">Наблюдения поставщика превращаются в проверяемый расход и решение о следующем шаге</h1>
      <script id="diagram-data" type="application/json">
        {
          "title": "Наблюдения поставщика превращаются в проверяемый расход и решение о следующем шаге",
          "width": 1350,
          "height": 1200,
          "direction": "top-down",
          "nodes": [
            {
              "id": "provider-attempt",
              "label": "Вызов API",
              "rank": 0,
              "order": 0,
              "kind": "actor"
            },
            {
              "id": "raw-observations",
              "label": "Данные поставщика\nиспользование · модель · исход",
              "rank": 1,
              "order": 0,
              "kind": "info"
            },
            {
              "id": "monotonic-time",
              "label": "Локальные часы\nначало · первое событие\nпервое содержимое · конец",
              "rank": 1,
              "order": 1,
              "kind": "info"
            },
            {
              "id": "normalizer",
              "label": "Нормализация\nнеизвестно — не ноль",
              "rank": 2,
              "order": 0,
              "kind": "accent"
            },
            {
              "id": "attempt-facts",
              "label": "Факты попытки\nтокены · задержка · исход",
              "rank": 3,
              "order": 0,
              "kind": "success"
            },
            {
              "id": "price-snapshot",
              "label": "Снимок тарифа\nверсия · валюта · ставки",
              "rank": 3,
              "order": 1,
              "kind": "info"
            },
            {
              "id": "cost-calculation",
              "label": "Расчёт стоимости\nсумма или неизвестно",
              "rank": 4,
              "order": 0,
              "kind": "default"
            },
            {
              "id": "usage-ledger",
              "label": "Журнал бюджета\nпо попыткам\nбез повторного учёта",
              "rank": 5,
              "order": 0,
              "kind": "success"
            },
            {
              "id": "budget-policy",
              "label": "Политика бюджета\nразрешить · запретить\nзапросить подтверждение",
              "rank": 6,
              "order": 0,
              "kind": "accent"
            },
            {
              "id": "agent-state",
              "label": "Состояние агента\nследующее обращение к модели",
              "rank": 7,
              "order": 0,
              "kind": "info"
            },
            {
              "id": "tool-policy",
              "label": "Полномочия инструмента\nотдельная проверка",
              "rank": 7,
              "order": 1,
              "kind": "danger"
            }
          ],
          "edges": [
            {
              "from": "provider-attempt",
              "to": "raw-observations",
              "label": "исход"
            },
            {
              "from": "provider-attempt",
              "to": "monotonic-time",
              "label": "измерить"
            },
            {
              "from": "raw-observations",
              "to": "normalizer",
              "label": "поля без потерь",
              "lane": -1
            },
            {
              "from": "monotonic-time",
              "to": "normalizer",
              "label": "смещения",
              "lane": 1
            },
            {
              "from": "normalizer",
              "to": "attempt-facts",
              "label": "зафиксировать"
            },
            {
              "from": "attempt-facts",
              "to": "cost-calculation",
              "label": "единицы",
              "lane": -1
            },
            {
              "from": "price-snapshot",
              "to": "cost-calculation",
              "label": "ставки",
              "lane": 1
            },
            {
              "from": "cost-calculation",
              "to": "usage-ledger",
              "label": "оценка или неизвестно"
            },
            {
              "from": "usage-ledger",
              "to": "budget-policy",
              "label": "остаток"
            },
            {
              "from": "budget-policy",
              "to": "agent-state",
              "label": "решение"
            },
            {
              "from": "agent-state",
              "to": "tool-policy",
              "label": "не выдаёт права",
              "dashed": true
            }
          ]
        }
      </script>
    </main>
    <script
      data-lesson-diagram-runtime
      src="../../../skills/build-lesson-notes/assets/diagram.js"
    ></script>
  </body>
</html>
