<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="lesson-diagram-template" content="study-sketch-v1">
    <title>Незавершённый поток не становится подтверждённым ответом</title>
    <link
      rel="stylesheet"
      data-lesson-diagram-style
      href="../../../skills/build-lesson-notes/assets/diagram.css"
    >
  </head>
  <body>
    <main
      id="lesson-diagram"
      aria-labelledby="diagram-title"
      data-render-state="pending"
    >
      <h1 id="diagram-title" class="visually-hidden">Незавершённый поток не становится подтверждённым ответом</h1>
      <script id="diagram-data" type="application/json">
        {
          "title": "Незавершённый поток не становится подтверждённым ответом",
          "width": 1200,
          "height": 1100,
          "direction": "left-right",
          "nodes": [
            {
              "id": "request",
              "label": "Запрос к модели\nодин крайний срок",
              "rank": 0,
              "order": 0,
              "kind": "default"
            },
            {
              "id": "started",
              "label": "Ответ\nначат",
              "rank": 1,
              "order": 0,
              "kind": "info"
            },
            {
              "id": "prefix",
              "label": "Фрагменты текста и\nаргументов инструмента",
              "rank": 2,
              "order": 0,
              "kind": "accent"
            },
            {
              "id": "output-complete",
              "label": "Результат завершён\nсведения необязательны",

              "order": 0,
              "kind": "info"
            },
            {
              "id": "cancel",
              "label": "Отмена\nинициатором",
              "rank": 3,
              "order": 1,
              "kind": "danger"
            },
            {
              "id": "deadline",
              "label": "Крайний срок\nистёк",
              "rank": 3,
              "order": 2,
              "kind": "danger"
            },
            {
              "id": "interrupt",
              "label": "Конец соединения /\nтранспортный сбой",
              "rank": 3,
              "order": 3,
              "kind": "danger"
            },
            {
              "id": "terminal",
              "label": "Ответ\nподтверждён",
              "rank": 4,
              "order": 0,
              "kind": "success"
            },
            {
              "id": "cancelled",
              "label": "Освободить ресурсы\nпередать отмену",
              "rank": 4,
              "order": 1,
              "kind": "danger"

            {

            {

            {
              "id": "commit",
              "label": "Зафиксировать ответ\nпроверить полномочия",
              "rank": 5,
              "order": 0,
              "kind": "success"

            {
              "id": "policy",
              "label": "Успеха нет\nрешает вызывающий слой",
              "rank": 5,
              "order": 1,
              "kind": "default"
            }
          ],
          "edges": [
            {
              "from": "request",
              "to": "started"
            },
            {
              "from": "started",
              "to": "prefix"

            {
              "from": "prefix",
              "to": "output-complete"
            },
            {
              "from": "output-complete",
              "to": "terminal"

            {
              "from": "terminal",
              "to": "commit"

            {
              "from": "prefix",
              "to": "cancel",

              "dashed": true
            },
            {
              "from": "cancel",
              "to": "cancelled",

            {
              "from": "prefix",
              "to": "deadline",

            {
              "from": "deadline",

            {
              "from": "prefix",

            {
              "from": "interrupt",
              "to": "partial",
              "dashed": true
            },
            {
              "from": "cancelled",
              "to": "policy",
              "dashed": true
            },
            {
              "from": "timed-out",
              "to": "policy",
              "dashed": true
            },
            {
              "from": "partial",
              "to": "policy",
              "dashed": true
            }
          ]
        }

    <script
      data-lesson-diagram-runtime
      src="../../../skills/build-lesson-notes/assets/diagram.js"
